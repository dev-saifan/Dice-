name: Build Android APK from Web Assets

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Initialize Capacitor Project in Cloud
      run: |
        npm init -y
        npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets
        npx cap init "Dice Roller" com.diceroller.app --web-dir www

    - name: Sync Web Assets & Generate Icons
      run: |
        npx cap add android
        npx cap sync android
        npx @capacitor/assets generate --iconAsset www/dice.png --android

    - name: Wipe Corrupted Gradle Caches
      run: |
        rm -rf /home/runner/.gradle/caches/
        rm -rf /home/runner/.gradle/wrapper/

    - name: Build Android Debug APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: dice-roller-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
