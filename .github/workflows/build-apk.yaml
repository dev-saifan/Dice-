name: Build Android APK from Web Assets

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Initialize Capacitor Project in Cloud
      run: |
        npm init -y
        npm install @capacitor/core @capacitor/cli @capacitor/android
        npx cap init "Dice Roller" com.diceroller.app --web-dir www

    - name: Sync Web Assets to Android Platform
      run: |
        npx cap add android
        npx cap sync android

    - name: Clear Gradle Cache Lock / Corrupt Files
      run: |
        rm -rf /home/runner/.gradle/caches/jars-9/

    - name: Build Android Debug APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --refresh-dependencies

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: dice-roller-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
