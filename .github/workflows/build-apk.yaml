name: Build Android APK from Web Assets

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Dependencies
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets

    - name: Create Capacitor Config
      run: |
        cat << 'EOF' > capacitor.config.json
        {
          "appId": "com.diceroller.app",
          "appName": "Dice Roller",
          "webDir": "www",
          "bundledWebRuntime": false
        }
        EOF

    - name: Add Android Platform & Sync
      run: |
        npx cap add android
        npx cap sync android

    - name: Prepare App Icon Assets
      run: |
        mkdir -p assets
        cp www/dice.png assets/icon-only.png

    - name: Generate App Icons
      run: |
        npx @capacitor/assets generate --android

    - name: Clear Gradle Caches
      run: |
        rm -rf /home/runner/.gradle/caches/
        rm -rf /home/runner/.gradle/wrapper/

    - name: Build Android Debug APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon --max-workers=1 -Dorg.gradle.parallel=false

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: dice-roller-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
